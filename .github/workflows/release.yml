name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build and publish
        required: true
        default: v0.3.2

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.sha }}

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-macos:
    name: Build unsigned macOS DMG
    runs-on: macos-15
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
      RELEASE_DIR: dist/github-release

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

      - name: Build unsigned Apple Silicon DMG
        run: npm run tauri -- build --bundles dmg --target aarch64-apple-darwin

      - name: Stage release asset
        run: |
          set -euo pipefail

          mkdir -p "$RELEASE_DIR"
          dmg_path="$(find "$CARGO_TARGET_DIR/aarch64-apple-darwin/release/bundle/dmg" -maxdepth 1 -name "*.dmg" -print -quit)"
          test -n "$dmg_path"

          release_dmg="$RELEASE_DIR/ExcaliApp-${RELEASE_TAG}-macos-arm64-unsigned.dmg"
          cp "$dmg_path" "$release_dmg"
          echo "RELEASE_DMG=$release_dmg" >> "$GITHUB_ENV"

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: excaliapp-macos-arm64-dmg
          path: ${{ env.RELEASE_DMG }}
          if-no-files-found: error

  build-windows:
    name: Build Windows installers
    runs-on: windows-2025
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}\src-tauri\target
      RELEASE_DIR: dist\github-release

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

      - name: Build NSIS and MSI installers
        run: npm run tauri -- build --bundles nsis,msi --target x86_64-pc-windows-msvc

      - name: Stage release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:RELEASE_DIR | Out-Null

          $nsisPath = Get-ChildItem "$env:CARGO_TARGET_DIR\x86_64-pc-windows-msvc\release\bundle\nsis\*.exe" |
            Select-Object -First 1 -ExpandProperty FullName
          $msiPath = Get-ChildItem "$env:CARGO_TARGET_DIR\x86_64-pc-windows-msvc\release\bundle\msi\*.msi" |
            Select-Object -First 1 -ExpandProperty FullName

          if (-not $nsisPath -or -not $msiPath) {
            throw "Windows installer artifacts were not produced."
          }

          $releaseExe = "$env:RELEASE_DIR\ExcaliApp-$env:RELEASE_TAG-windows-x64-setup.exe"
          $releaseMsi = "$env:RELEASE_DIR\ExcaliApp-$env:RELEASE_TAG-windows-x64.msi"
          Copy-Item $nsisPath $releaseExe
          Copy-Item $msiPath $releaseMsi
          "RELEASE_EXE=$releaseExe" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_MSI=$releaseMsi" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: excaliapp-windows-x64-installers
          path: |
            ${{ env.RELEASE_EXE }}
            ${{ env.RELEASE_MSI }}
          if-no-files-found: error

  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-24.04
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
      RELEASE_DIR: dist/github-release

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Install Linux build dependencies
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

      - name: Build Linux AppImage
        run: npm run tauri -- build --bundles appimage

      - name: Stage release asset
        run: |
          set -euo pipefail

          mkdir -p "$RELEASE_DIR"
          appimage_path="$(find "$CARGO_TARGET_DIR/release/bundle/appimage" -maxdepth 1 -name "*.AppImage" -print -quit)"
          test -n "$appimage_path"

          release_appimage="$RELEASE_DIR/ExcaliApp-${RELEASE_TAG}-linux-x86_64.AppImage"
          cp "$appimage_path" "$release_appimage"
          echo "RELEASE_APPIMAGE=$release_appimage" >> "$GITHUB_ENV"

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: excaliapp-linux-x86_64-appimage
          path: ${{ env.RELEASE_APPIMAGE }}
          if-no-files-found: error

  github-release:
    name: Create GitHub Release
    needs:
      - build-macos
      - build-windows
      - build-linux
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist/github-release
          merge-multiple: true

      - name: List release artifacts
        run: find dist/github-release -maxdepth 1 -type f -print

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/github-release/*
          generate_release_notes: true
          tag_name: ${{ env.RELEASE_TAG }}
          body: |
            ## Installation notes

            The macOS Apple Silicon DMG is unsigned and intended for internal use. macOS may require approval in **System Settings > Privacy & Security** before first launch.
